name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unzip project
        run: python3 -m zipfile -e FireCleaner.zip .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          cd FireCleaner
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          bash ./gradlew assembleRelease --no-daemon --stacktrace
      - run: cp FireCleaner/app/build/outputs/apk/release/app-release.apk FireCleaner.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: FireCleaner.apk
          make_latest: true
